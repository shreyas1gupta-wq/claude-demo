name: registry-ci
on:
  push:
    paths: ["config/**", "quant/**", "tests/**", "scripts/**", ".github/workflows/registry-ci.yml"]
  pull_request:
    paths: ["config/**", "quant/**", "tests/**", "scripts/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Registry must load clean (a registry violating its own budget fails to load)
        run: python config/validator.py
      - name: Estimation library tests (zero network, fixtures/synthetic only)
        run: python -m pytest
