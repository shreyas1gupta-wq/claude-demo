name: gates
# The same two gates every local commit must pass (CLAUDE.md discipline #3),
# enforced remotely on every push so the record stays green even if a local hook is bypassed.
on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install numpy pandas scipy pytest pyyaml openpyxl
      - name: pytest
        run: python3 -m pytest tests/ -q
      - name: registry validator
        run: python3 config/validator.py
