# CHALLENGER REGISTRY — the single adaptivity-admission law (PIPELINE §Challenger registry)
# Every adaptive or promotable rule lives in EXACTLY ONE lane. The validator enforces:
# lanes are {shadow, challenger, online}; nothing may be 'online' before its review_date
# and win_criteria exist; production code may consume ONLY rules marked online.
# Promotions happen ONLY at the fixed review dates (set a year ahead; never reactive).
review_calendar:
  quarterly: ["2026-12-01", "2027-03-01", "2027-06-01", "2027-09-01"]
  annual: "2027-09-01"
  provenance: "PIPELINE.md §Challenger registry — dates fixed in advance so none can be chosen or avoided in reaction to performance"
rules:
